<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>CAPEC Pagos</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#FFFFFF">
  <link rel="icon" type="image/png" href="icono-192.png">
  <!-- iPhone / iPad -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="CAPEC Pagos">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; background: #FFFFFF; font-family: system-ui, -apple-system, sans-serif; overflow: hidden; }
    body { padding-top: env(safe-area-inset-top); }
    #cargando {
      position: fixed; inset: 0; top: env(safe-area-inset-top); display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 16px; padding: 24px;
      background: #FFFFFF; z-index: 5; text-align: center;
    }
    #cargando img { width: 170px; height: auto; }
    .spinner {
      width: 34px; height: 34px; border-radius: 50%;
      border: 4px solid rgba(20,9,98,0.15); border-top-color: #BB2C1E;
      animation: girar 0.9s linear infinite;
    }
    @keyframes girar { to { transform: rotate(360deg); } }
    #cargando p { color: #140962; font-size: 14px; font-weight: 600; letter-spacing: 0.3px; max-width: 300px; line-height: 1.4; }
    #reintentar {
      display: none; background: #BB2C1E; color: #fff; border: 0; border-radius: 10px;
      padding: 12px 22px; font-size: 15px; font-weight: 700; cursor: pointer;
    }
    iframe { width: 100%; height: 100%; border: none; display: block; background: #F4F6F8; }
  </style>
</head>
<body>

  <div id="cargando">
    <img src="logo-carga.png" alt="CAPEC Pagos">
    <div class="spinner" id="spinner"></div>
    <p id="aviso">Cargando…</p>
    <button id="reintentar" onclick="location.reload()">Reintentar</button>
  </div>

  <script src="config.js"></script>
  <script>
    // ---- Lo único que cambia entre la app del personal y la del alumno ----
    var MODO_APP = '';            // '' = personal · 'alumno' = portal del alumno
    var RUTA_SW = 'sw.js';
    // -----------------------------------------------------------------------
    (function () {
      var cargando = document.getElementById('cargando');
      var aviso = document.getElementById('aviso');
      var spinner = document.getElementById('spinner');
      var boton = document.getElementById('reintentar');
      function problema(texto) {
        aviso.textContent = texto; spinner.style.display = 'none'; boton.style.display = 'inline-block';
        cargando.style.display = 'flex';
      }

      var id = (typeof ID_MOTOR === 'string' ? ID_MOTOR : '').trim();
      if (!id || id.indexOf('PEGA_AQUI') === 0) { problema('Falta poner el ID del motor en config.js'); return; }
      if (!navigator.onLine) { problema('Sin internet. Conéctate y vuelve a intentar.'); }

      // La URL se arma por partes (nunca escrita completa)
      var url = 'https:' + '//' + 'script.google.com' + '/macros/s/' + encodeURIComponent(id) + '/exec';
      // Pasa al motor lo que traiga la dirección (ej. ?m=MATRICULA) + el modo
      var params = new URLSearchParams(location.search);
      if (MODO_APP) params.set('app', MODO_APP);
      var qs = params.toString();
      if (qs) url += '?' + qs;

      var listo = false;
      var marco = document.createElement('iframe');
      marco.id = 'app';
      marco.setAttribute('allow', 'fullscreen; clipboard-read; clipboard-write');
      marco.onload = function () { listo = true; cargando.style.display = 'none'; };
      marco.src = url;
      document.body.appendChild(marco);

      setTimeout(function () {
        if (!listo) problema('Está tardando más de lo normal. Revisa tu internet y vuelve a intentar.');
      }, 30000);
      window.addEventListener('online', function () { if (!listo) location.reload(); });
    })();

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register(RUTA_SW).catch(function () {});
    }
  </script>
</body>
</html>
